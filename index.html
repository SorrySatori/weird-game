<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Upper Morkezela: A Weird Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Black letterbox bars (the 4:3 game centred on a widescreen) read as intentional,
               unlike the old grey. */
            background-color: #000000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #game-container {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        canvas {
            /* Phaser's FIT scale mode sizes and centres the canvas itself (inline styles);
               don't force width/height here or it would stretch and distort. Keep pixels crisp. */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <!-- Load error blocker to suppress WebGL errors -->
    <script src="error-blocker.js"></script>
    <script src="node_modules/phaser/dist/phaser.min.js"></script>
    <script src="game-api.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
